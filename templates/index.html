<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Registrierung</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 50px; background: #f4f4f9; }
        .box { background: white; padding: 30px; border-radius: 10px; max-width: 400px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); margin: 0 auto; }
        input { width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; }
        button { width: 100%; padding: 10px; background: #28a745; color: white; border: none; border-radius: 5px; cursor: pointer; font-size: 16px; }
        button:hover { background: #218838; }
    </style>
</head>
<body>
    <div class="box">
        <h2>Neues Konto erstellen</h2>
        <form action="/register" method="POST">
            <input type="text" name="benutzername" placeholder="Benutzername" required>
            <input type="email" name="email" placeholder="E-Mail-Adresse" required>
            <input type="password" name="passwort" placeholder="Passwort" required>
            <button type="submit">Registrieren</button>
        </form>
    </div>
</body>
</html>
